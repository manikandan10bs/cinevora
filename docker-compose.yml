version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinevora-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-3.5-flash-lite
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped

  frontend-react:
    build:
      context: ./frontend_ui
      dockerfile: Dockerfile
    container_name: cinevora-ui
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    restart: unless-stopped
